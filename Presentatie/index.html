# Onderwerp

Op  dinsdag 10 februari 2026 kondigde Ye aan dat hij een concert zou gaan geven in de Gelredome. Voor het eerst sinds 13 jaar kwam een van de grootste hiphop
artiesten ooit terug naar Nederland. Ik wist nog niet heel veen van Ye of Kanye West af, maar ik en een vriend besloten heen te gaan. Dit resulteerde in een van
de beste avonden van mijn leven en zorgde dat ik begon met het luisteren van muziek. In deze presentatie vertel ik over KanYe West.

![placeholder image](../Presentatie/20260608_204736 1.jpg)

#introtekst

Kanye West is geboren op 8 juni 1977 in Atlanta Georgia, waarna hij is opgegroeid in Chicago met zijn moeder Donda West. Toen Kanye 13 was had hij zijn eerste
rapnummer geschreven, hij was dus al erg vroeg begonnen. Sinds toen is hij vooral doorgegaan met het produceren van beats, tot hij in 2004 zijn debuutalbum *"The Collage Dropout"*
uitbracht en de hip-hop industrie voor altijd veranderde.
